services:
  smartgate-edge:
    build: .
    environment:
      SMARTGATE_DB_PATH: /data/smartgate.db
      SMARTGATE_API_KEY: ${SMARTGATE_API_KEY:?Set SMARTGATE_API_KEY in environment; no secrets in git}
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - smartgate-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  smartgate-data:
